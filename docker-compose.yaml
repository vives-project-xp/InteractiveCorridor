services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./Backend/
    ports:
      - "${BACKEND_PORT}:3000"
    restart: always
    env_file:
      - .env
    depends_on:
      - database
      - mosquitto

  website:
    build:
      context: ./website/
      args:
        VITE_BACKEND_URL: "${BACKEND_URL}:${BACKEND_PORT}"
        VITE_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
        VITE_TIMEOUT_TIME: "${TIMEOUT_TIME}"
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/conf:/mosquitto/config

volumes:
  db_data:
